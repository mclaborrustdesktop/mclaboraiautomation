# oauth2-proxy for the container deployment. Client id, issuer, redirect URL, e-mail domain and both secrets come
# from the environment / secret files set in docker-compose.yml, never from this file.
http_address = "0.0.0.0:4180"
reverse_proxy = true
upstreams = [ "static://202" ]
provider = "oidc"                      # Microsoft Entra ID (Microsoft 365) or Google via OpenID Connect
oidc_email_claim = "email"
set_xauthrequest = true
pass_access_token = false
skip_provider_button = true
cookie_secure = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "1h"
